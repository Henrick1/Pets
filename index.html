<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Pets</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
}
#stage {
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
  touch-action: none;
  outline: none;
}
#stage.moving { cursor: move; }
#tab {
  position: absolute;
  top: 8px;
  left: 50%;
  width: 196px;
  box-sizing: border-box;
  padding: 7px 12px 9px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 3px 10px rgba(30, 35, 64, 0.25);
  font: 600 12px system-ui, sans-serif;
  color: #2b3a33;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
#tab.open {
  opacity: 1;
  transform: translate(-50%, 0);
}
#tab::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  margin-left: -7px;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid rgba(255, 255, 255, 0.94);
}
#tab .stat {
  display: grid;
  grid-template-columns: 34px 1fr 34px;
  align-items: center;
  gap: 6px;
  height: 16px;
}
#tab .stat span:last-child {
  text-align: right;
}
#tab .track {
  height: 8px;
  border-radius: 4px;
  background: #dfe8e3;
  overflow: hidden;
}
#hunger-fill, #life-fill, #xp-fill {
  height: 100%;
  width: 100%;
  border-radius: 4px;
  background: #5fbf8c;
  transition: width 0.4s ease, background 0.4s ease;
}
#xp-fill {
  background: #6c8cff;
}
#status {
  margin-top: 3px;
  text-align: center;
  color: #b3261e;
}
#levelup {
  margin-top: 3px;
  text-align: center;
  color: #1b6b43;
}
@media (prefers-reduced-motion: reduce) {
  #tab, #hunger-fill, #life-fill, #xp-fill { transition: none; }
}
</style>
</head>
<body>
<canvas id="stage" tabindex="0"></canvas>
<div id="tab" role="status" aria-live="polite">
  <div class="stat"><span>Fome</span><div class="track"><div id="hunger-fill"></div></div><span id="hunger-val">100%</span></div>
  <div class="stat"><span>Vida</span><div class="track"><div id="life-fill"></div></div><span id="life-val">100%</span></div>
  <div class="stat"><span id="level-label">Nv 1</span><div class="track"><div id="xp-fill"></div></div><span id="xp-val">0%</span></div>
  <div id="status" hidden>Morrendo</div>
  <div id="levelup" hidden></div>
</div>
<script src="node_modules/three/build/three.min.js"></script>
<script src="lib/pet-kit.js"></script>
<script src="renderer.js"></script>
</body>
</html>
